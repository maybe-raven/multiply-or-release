[package]
name = "multiply_or_release"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = "0.14.0"
bevy-inspector-egui = { version = "0.26.0", optional = true }
bevy_rapier2d = "0.27.0"
log = { version = "*", features = ["release_max_level_warn"] }
rand = "0.8.5"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
bevy_hanabi = { version = "0.12.2", default-features = false, features = ["2d"] }

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# This is used by trunk as it doesn't support custom profiles: https://github.com/trunk-rs/trunk/issues/605
# xbuild also uses this profile for building android AABs because I couldn't find a configuration for it
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[features]
dev = [ "bevy/dynamic_linking", "dep:bevy-inspector-egui" ]
